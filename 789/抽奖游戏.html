<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红红管家 · 专属抽奖</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
        body{background:#1E1E2F;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
        .tip{font-size:14px;color:#ccc;margin-bottom:20px;}
        .egg-group{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;}
        .egg{width:90px;height:120px;background:radial-gradient(circle at 28% 28%,#FFC107,#B8860B);border-radius:50% 50% 46% 46%;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;transition:0.3s;border:2px solid rgba(255,255,255,0.2);}
        .egg:hover{transform:translateY(-6px);}
        .egg.broken{background:#333;transform:rotate(10deg);cursor:default;}
        .wheel-group{display:none;position:relative;width:320px;height:320px;margin-bottom:24px;}
        .wheel{width:100%;height:100%;border-radius:50%;border:6px solid #252538;position:relative;overflow:hidden;transition:all 5.5s cubic-bezier(0.15,0.8,0.1,1);background:#1E1E2F;}
        .wheel-item{position:absolute;width:50%;height:50%;left:50%;top:0;transform-origin:bottom left;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#000;border-right:1px solid rgba(0,0,0,0.1);}
        .wheel-item span{transform:rotate(calc(180deg / var(--n) * 0.5));padding-top:20px;}
        .wheel-pointer{position:absolute;top:-24px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:24px solid transparent;border-right:24px solid transparent;border-top:48px solid #FFC107;z-index:10;}
        .box-group{display:none;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;}
        .m-box{width:100px;height:140px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;transition:0.3s;background:linear-gradient(180deg,#B8860B,#FFC107);border:2px solid rgba(255,255,255,0.2);}
        .m-box:hover{transform:translateY(-8px);}
        .m-box.opened{background:#333;cursor:default;transform:none;}
        .status{font-size:13px;color:#ccc;margin-top:12px;}
        .win-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px;}
        .win-modal.show{display:flex;}
        .win-box{background:#252538;border-radius:16px;padding:28px 20px;text-align:center;max-width:340px;width:100%;border:2px solid #FFC107;}
        .win-icon{font-size:52px;margin-bottom:8px;animation:bounce 0.7s ease-in-out infinite alternate;}
        @keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-6px);}}
        .win-title{font-size:18px;color:#FFC107;margin-bottom:6px;font-weight:700;}
        .win-prize{font-size:22px;font-weight:800;color:#FFC107;margin-bottom:8px;}
        .win-desc{font-size:13px;color:#ccc;margin-bottom:16px;}
        .win-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
        .win-btn{padding:8px 20px;border-radius:6px;border:none;font-weight:600;cursor:pointer;font-size:13px;}
        .win-btn.ok{background:#FFC107;color:#000;}
        .win-btn.copy{background:#33334A;color:#fff;}
        .err{color:#EF4444;font-size:14px;text-align:center;}
    </style>
</head>
<body>
<div id="errBox" class="err" style="display:none;"></div>
<div id="gameBox" style="display:none;">
    <div class="tip">会员专属活动 · 剩余次数：<span id="leftCount"></span></div>
    <div class="egg-group" id="eggBox"></div>
    <div class="wheel-group" id="wheelBox"><div class="wheel" id="wheel"></div><div class="wheel-pointer"></div></div>
    <div class="box-group" id="boxBox"></div>
    <div class="status" id="gameStatus"></div>
</div>

<div class="win-modal" id="winModal">
    <div class="win-box">
        <div class="win-icon">🎉</div>
        <div class="win-title">恭喜！</div>
        <div class="win-prize" id="winPrize"></div>
        <div class="win-desc" id="winExtra"></div>
        <div class="win-desc">凭证已生成，联系管理员兑奖</div>
        <div class="win-actions">
            <button class="win-btn copy" id="copyVoucher">复制凭证</button>
            <button class="win-btn ok" id="closeWin">我知道了</button>
        </div>
    </div>
</div>

<script>
const SIGN = "HHGJ_2026_GAME_SPLIT";
const STORAGE_KEY = "HHGJ_DATA_GAME";
let prizePool, winList, gameCfg, used=0;

function showErr(msg){document.getElementById("errBox").style.display="block";document.getElementById("errBox").innerText=msg;}
function loadData(){
    const defaultPool = {
        egg: [{name:"8元彩金",stock:20,rate:52.6},{name:"18元彩金",stock:10,rate:26.3},{name:"28元彩金",stock:5,rate:13.2},{name:"38元彩金",stock:3,rate:7.9}],
        wheel: [{name:"谢谢参与",color:"#eee",rate:40},{name:"5元券",color:"#DBEAFE",rate:30},{name:"15元券",color:"#FEF3C7",rate:20},{name:"免单",color:"#FBBF24",rate:8},{name:"大奖",color:"#EF4444",rate:2}],
        box: [{name:"再来一次",rare:"普通",rate:45},{name:"小礼品",rare:"普通",rate:35},{name:"20元券",rare:"稀有",rate:15},{name:"大礼包",rare:"史诗",rate:4},{name:"终极大奖",rare:"传说",rate:1}]
    };
    try{
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        prizePool = d.prizePool || defaultPool; winList = d.winList || [];
    }catch(e){prizePool = defaultPool; winList = [];}
}

function parseLink(){
    const hash = window.location.hash.slice(1);
    if(!hash) return showErr("无效链接，请联系管理员");
    const p = new URLSearchParams(hash);
    const s = p.get("s"), id = decodeURIComponent(p.get("id")), t = p.get("t"), n = Number(p.get("n")), e = Number(p.get("e"));
    if(!s||!id||!t||!n||!e) return showErr("链接参数错误");
    if(Date.now()>e) return showErr("链接已过期，请联系管理员重新生成");
    try{
        const decode = atob(s);
        if(!decode.includes(SIGN)||!decode.includes(id)) throw new Error("签名无效");
        gameCfg = {id,type:t,max:n};
        document.getElementById("leftCount").innerText = n;
        document.getElementById("gameBox").style.display = "flex";
        initGame();
    }catch(err){showErr("链接无效或被篡改");}
}

function initGame(){
    if(gameCfg.type==="egg"){
        document.getElementById("eggBox").style.display = "flex";
        for(let i=0;i<gameCfg.max;i++){
            const e = document.createElement("div"); e.className="egg"; e.innerText="🥚"; e.onclick=()=>openEgg(e);
            document.getElementById("eggBox").appendChild(e);
        }
    }else if(gameCfg.type==="wheel"){
        document.getElementById("wheelBox").style.display = "block";
        const w = document.getElementById("wheel"); w.innerHTML="";
        const list = prizePool.wheel, n = list.length, deg = 360/n;
        list.forEach((p,i)=>{
            const d = document.createElement("div"); d.className="wheel-item"; d.style.background=p.color; d.style.transform=`rotate(${i*deg}deg)`; d.style.setProperty("--n",n); d.innerHTML=`<span>${p.name}</span>`; w.appendChild(d);
        });
        document.querySelector(".wheel-pointer").onclick = spinWheel;
    }else{
        document.getElementById("boxBox").style.display = "flex";
        for(let i=0;i<gameCfg.max;i++){
            const m = document.createElement("div"); m.className="m-box"; m.innerText="📦"; m.onclick=()=>openBox(m);
            document.getElementById("boxBox").appendChild(m);
        }
    }
}

function getPrize(type){
    let r=Math.random()*100,s=0;
    for(let p of prizePool[type]){s+=p.rate;if(r<=s)return p;}
    return prizePool[type][0];
}
function showWin(prize,extra){
    const voucher = btoa(`${SIGN}|${gameCfg.id}|${prize.name}|${Date.now()}|${Math.random().toString(36).slice(2,10)}`).replace(/=/g,"");
    winList.push({voucher,mid:gameCfg.id,prize:prize.name,extra:extra||"",time:new Date().toLocaleString()});
    localStorage.setItem(STORAGE_KEY, JSON.stringify({prizePool,winList}));
    document.getElementById("winPrize").innerText = prize.name;
    document.getElementById("winExtra").innerText = extra||"";
    document.getElementById("winModal").classList.add("show");
    window.LAST_VOUCHER = voucher;
}
document.getElementById("copyVoucher").onclick=()=>{navigator.clipboard.writeText(window.LAST_VOUCHER||"");alert("凭证已复制！");};
document.getElementById("closeWin").onclick=()=>{document.getElementById("winModal").classList.remove("show");};

function openEgg(el){
    if(el.classList.contains("broken")||used>=gameCfg.max) return;
    el.classList.add("broken"); el.innerText="💥"; used++;
    showWin(getPrize("egg"),`第${used}次`);
    document.getElementById("leftCount").innerText = gameCfg.max - used;
}
function spinWheel(){
    if(used>=gameCfg.max) return;
    used++;
    const p = getPrize("wheel");
    const list = prizePool.wheel, idx = list.indexOf(p), deg = 360/list.length;
    document.getElementById("wheel").style.transform = `rotate(${360*10 + (360 - (idx*deg + deg/2))}deg)`;
    setTimeout(()=>{showWin(p,`第${used}次`);document.getElementById("leftCount").innerText = gameCfg.max - used;},5500);
}
function openBox(el){
    if(el.classList.contains("opened")||used>=gameCfg.max) return;
    el.classList.add("opened"); el.innerText="已开启"; used++;
    const p = getPrize("box");
    showWin(p,`第${used}次 | ${p.rare}`);
    document.getElementById("leftCount").innerText = gameCfg.max - used;
}

window.onload=()=>{loadData();parseLink();};
</script>
</body>
</html>
