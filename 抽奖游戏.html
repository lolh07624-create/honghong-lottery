<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>红红VIP专属抽奖</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;}
        body{background:radial-gradient(circle at top,#2A2A55 0%,#121220 70%);color:#fff;min-height:100vh;padding:30px 16px;display:flex;flex-direction:column;align-items:center;}
        .head{text-align:center;margin-bottom:30px;animation:fadeIn 0.6s ease-out;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
        .title{font-size:28px;font-weight:900;color:#FFD700;letter-spacing:4px;text-shadow:0 0 20px rgba(255,215,0,0.6);margin-bottom:12px;}
        .count{display:inline-block;padding:8px 24px;background:rgba(255,215,0,0.1);border:2px solid rgba(255,215,0,0.3);border-radius:50px;font-size:16px;color:#ccc;}
        .count strong{color:#FFD700;font-size:18px;}

        /* 砸金蛋 */
        .egg-wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;animation:fadeIn 0.6s ease-out 0.1s both;}
        .egg{width:120px;height:150px;border-radius:55% 55% 50% 50%;background:radial-gradient(circle at 30% 20%,#fff 0%,#FFF9CC 25%,#FFD700 55%,#B8860B 100%);display:flex;align-items:center;justify-content:center;font-size:56px;cursor:pointer;box-shadow:0 0 35px rgba(255,215,0,0.5);transition:all 0.2s;}
        .egg:hover{transform:translateY(-8px);box-shadow:0 0 50px rgba(255,215,0,0.7);}
        .egg.done{background:#1A1A33;cursor:default;transform:scale(0.9);box-shadow:none;}
        .egg.done::after{content:"💥";font-size:60px;}

        /* 转盘 */
        .wheel-wrap{width:420px;height:420px;margin:0 auto;position:relative;animation:fadeIn 0.6s ease-out 0.1s both;}
        .wheel{width:100%;height:100%;border-radius:50%;border:12px solid #FFD700;background:#1A1A33;position:relative;overflow:hidden;box-shadow:0 0 50px rgba(255,215,0,0.5);}
        .seg{position:absolute;width:50%;height:50%;left:50%;top:0;transform-origin:bottom left;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#000;border-right:1px solid rgba(255,255,255,0.2);}
        .seg span{transform:rotate(calc(180deg / var(--n) * 0.5));padding-top:40px;}
        .pointer{position:absolute;top:-35px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:35px solid transparent;border-right:35px solid transparent;border-top:70px solid #FFD700;cursor:pointer;filter:drop-shadow(0 0 15px rgba(255,215,0,0.9));animation:glow 1.5s infinite;}
        .pointer::after{content:"点击旋转";position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:13px;color:#FFD700;white-space:nowrap;}
        @keyframes glow{0%,100%{opacity:1;}50%{opacity:0.7;}}
        .spin{animation:turn 7s cubic-bezier(0.14,0.8,0.08,1) forwards;}
        @keyframes turn{from{transform:rotate(0deg);}to{transform:rotate(calc(360deg*10 + var(--stop)));}}

        /* 盲盒 */
        .box-wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;animation:fadeIn 0.6s ease-out 0.1s both;}
        .box{width:130px;height:160px;border-radius:18px;background:linear-gradient(180deg,#fff 0%,#FFF9CC 15%,#FFD700 50%,#B8860B 100%);display:flex;align-items:center;justify-content:center;font-size:56px;cursor:pointer;box-shadow:0 0 35px rgba(255,215,0,0.5);transition:all 0.2s;}
        .box:hover{transform:translateY(-8px);box-shadow:0 0 50px rgba(255,215,0,0.7);}
        .box.done{background:#1A1A33;cursor:default;transform:scale(0.9);}
        .box.done::after{content:"已开启";position:absolute;font-size:16px;color:#ccc;}

        /* 中奖弹窗 */
        .win{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:9999;backdrop-filter:blur(10px);}
        .win.show{display:flex;}
        .win-card{background:linear-gradient(160deg,#1A1A33,#121220);border:4px solid #FFD700;border-radius:28px;padding:40px 30px;text-align:center;max-width:450px;width:90%;box-shadow:0 0 70px rgba(255,215,0,0.6);animation:pop 0.6s ease-out;}
        @keyframes pop{0%{transform:scale(0.7);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
        .win-icon{font-size:90px;margin-bottom:20px;animation:glow 1s infinite alternate;}
        .win-title{font-size:28px;color:#FFD700;font-weight:900;margin-bottom:16px;}
        .win-name{font-size:32px;font-weight:900;color:#FFD700;margin-bottom:20px;}
        .btn{padding:14px 32px;border-radius:12px;border:none;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(90deg,#B8860B,#FFD700);color:#000;box-shadow:0 6px 20px rgba(255,215,0,0.5);}
        .err{color:#FF6B6B;font-size:18px;text-align:center;padding:60px 20px;display:none;}
        .hidden{display:none !important;}
    </style>
</head>
<body>
<div class="err" id="err"></div>
<div id="page" class="hidden">
    <div class="head">
        <div class="title">红红VIP专属抽奖</div>
        <div class="count">剩余抽奖次数：<strong id="num">0</strong> 次</div>
    </div>
    <div class="egg-wrap hidden" id="eggs"></div>
    <div class="wheel-wrap hidden" id="wheelBox">
        <div class="wheel" id="wheel"></div>
        <div class="pointer" id="go"></div>
    </div>
    <div class="box-wrap hidden" id="boxes"></div>
</div>
<div class="win" id="win">
    <div class="win-card">
        <div class="win-icon">🎊</div>
        <div class="win-title">恭喜您中奖啦</div>
        <div class="win-name" id="prize"></div>
        <button class="btn" onclick="document.getElementById('win').classList.remove('show')">太棒了！</button>
    </div>
</div>

<script>
// ⚠️ 签名和后台必须完全一致！
const SIGN = "HHGJ_2026_GAME_FINAL_PERFECT";
const POOL_KEY = "HHGJ_PRIZE_POOL";
let used = 0, total = 0, gameType = "", storageKey = "", prizePool = null;

function showErr(msg){document.getElementById("err").style.display="block";document.getElementById("err").innerText=msg;}
function updateCount(){document.getElementById("num").innerText=total-used;}
function showWin(name){document.getElementById("prize").innerText=name;document.getElementById("win").classList.add("show");}
function randPrize(type){
    let r=Math.random()*100,s=0;
    for(let i of prizePool[type]){s+=i.rate;if(r<=s)return i;}
    return prizePool[type][0];
}

window.onload=()=>{
    // 加载奖池
    try{prizePool = JSON.parse(localStorage.getItem(POOL_KEY)||"{}");}
    catch{prizePool = {egg:[{name:"8元彩金",rate:52.6}],wheel:[{name:"谢谢参与",rate:100}],box:[{name:"谢谢参与",rate:100}]};}

    // 解析链接
    const h=location.hash.slice(1);
    if(!h)return showErr("无效链接，请联系管理员获取");
    const p=new URLSearchParams(h);
    const s=p.get("s"),id=decodeURIComponent(p.get("id")),t=p.get("t"),n=Number(p.get("n")),e=Number(p.get("e"));
    if(!s||!id||!t||!n||!e)return showErr("链接参数错误");
    if(Date.now()>e)return showErr("链接已过期");
    try{if(!atob(s).includes(SIGN)||!atob(s).includes(id))throw 0;}
    catch{return showErr("链接已被篡改，请重新获取");}

    // 次数校验
    storageKey = `HHGJ_${id}_${t}_${n}`;
    used = Number(localStorage.getItem(storageKey)||0);
    total = n; gameType = t;
    if(used>=total)return showErr("您的抽奖次数已用完，请联系管理员获取新资格");

    // 渲染界面
    document.getElementById("page").classList.remove("hidden");
    updateCount();
    if(t==="egg"){
        document.getElementById("eggs").classList.remove("hidden");
        for(let i=0;i<n;i++){
            const egg=document.createElement("div");
            egg.className="egg";egg.innerText="🥚";
            egg.onclick=()=>{
                if(egg.classList.contains("done")||used>=n)return;
                egg.classList.add("done");used++;localStorage.setItem(storageKey,used);updateCount();
                setTimeout(()=>showWin(randPrize("egg").name),300);
            };
            document.getElementById("eggs").appendChild(egg);
        }
    }else if(t==="wheel"){
        document.getElementById("wheelBox").classList.remove("hidden");
        const w=document.getElementById("wheel");w.innerHTML="";
        const list=prizePool.wheel,c=list.length,d=360/c;
        list.forEach((item,i)=>{
            const seg=document.createElement("div");
            seg.className="seg";seg.style.background=item.color;
            seg.style.transform=`rotate(${i*d}deg)`;seg.style.setProperty("--n",c);
            seg.innerHTML=`<span>${item.name}</span>`;
            w.appendChild(seg);
        });
        document.getElementById("go").onclick=()=>{
            if(w.classList.contains("spin")||used>=n)return;
            used++;localStorage.setItem(storageKey,used);updateCount();
            const p=randPrize("wheel"),idx=list.indexOf(p);
            w.style.setProperty("--stop",360-(idx*d+d/2)+"deg");
            w.classList.add("spin");
            setTimeout(()=>{w.classList.remove("spin");showWin(p.name);},7000);
        };
    }else{
        document.getElementById("boxes").classList.remove("hidden");
        for(let i=0;i<n;i++){
            const box=document.createElement("div");
            box.className="box";box.innerText="🎁";
            box.onclick=()=>{
                if(box.classList.contains("done")||used>=n)return;
                box.classList.add("done");used++;localStorage.setItem(storageKey,used);updateCount();
                setTimeout(()=>showWin(randPrize("box").name),300);
            };
            document.getElementById("boxes").appendChild(box);
        }
    }
};
</script>
</body>
</html>
