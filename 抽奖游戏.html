<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红红VIP专属抽奖</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;}
        :root{
            --gold-main:#FFD700;
            --gold-light:#FFF5CC;
            --gold-dark:#B8860B;
            --bg-main:#121220;
            --bg-card:#1A1A33;
            --text-white:#FFFFFF;
            --text-gray:#D0D0E8;
            --border-gold:rgba(255,215,0,0.3);
            --shadow-gold:0 0 40px rgba(255,215,0,0.5);
            --shadow-card:0 12px 50px rgba(0,0,0,0.6);
        }
        body{
            background:radial-gradient(circle at top center,#2A2A55 0%,var(--bg-main) 70%);
            color:var(--text-white);
            min-height:100vh;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            padding:24px 16px;
            overflow-x:hidden;
        }

        /* 全局动画 */
        @keyframes fadeUp{from{opacity:0;transform:translateY(40px);}to{opacity:1;transform:translateY(0);}}
        @keyframes glowBreath{0%,100%{box-shadow:0 0 25px rgba(255,215,0,0.4);}50%{box-shadow:0 0 50px rgba(255,215,0,0.8);}}
        @keyframes bounceIn{0%{transform:scale(0.7);opacity:0;}60%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
        @keyframes confettiFall{0%{transform:translateY(-40px) rotate(0deg);opacity:1;}100%{transform:translateY(180vh) rotate(1800deg);opacity:0;}}
        @keyframes wheelSpin{from{transform:rotate(0deg);}to{transform:rotate(calc(360deg * 12 + var(--stop-deg)));}}
        @keyframes eggShake{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-10deg);}75%{transform:rotate(10deg);}}
        @keyframes boxFlip{0%{transform:perspective(1200px) rotateY(0deg);}50%{transform:perspective(1200px) rotateY(180deg);}100%{transform:perspective(1200px) rotateY(360deg);}}
        @keyframes btnPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
        @keyframes starShine{0%,100%{opacity:0.3;transform:scale(0.8);}50%{opacity:1;transform:scale(1.2);}}

        /* 品牌头部：强制显示「红红VIP专属」 */
        .brand-top{
            text-align:center;
            margin-bottom:36px;
            animation:fadeUp 0.8s ease-out;
        }
        .vip-title{
            font-size:28px;
            font-weight:900;
            color:var(--gold-main);
            margin-bottom:12px;
            letter-spacing:4px;
            text-shadow:0 0 20px rgba(255,215,0,0.6);
            animation:glowBreath 2s infinite;
        }
        .count-badge{
            display:inline-block;
            padding:10px 30px;
            background:rgba(255,215,0,0.12);
            border:2px solid var(--border-gold);
            border-radius:50px;
            font-size:17px;
            color:var(--text-gray);
            animation:fadeUp 0.8s ease-out 0.15s both;
        }
        .count-badge strong{color:var(--gold-main);font-weight:800;margin:0 6px;font-size:20px;}

        /* 开始按钮：每个游戏都有，一眼看到点哪里 */
        .start-wrap{display:none;text-align:center;margin-bottom:40px;animation:fadeUp 0.8s ease-out 0.25s both;}
        .start-btn{
            padding:14px 40px;
            font-size:18px;
            font-weight:800;
            color:#000;
            background:linear-gradient(90deg,var(--gold-dark),var(--gold-main),var(--gold-light));
            border:none;
            border-radius:50px;
            cursor:pointer;
            box-shadow:var(--shadow-gold);
            transition:all 0.3s ease;
            animation:glowBreath 1.8s infinite;
        }
        .start-btn:hover{transform:translateY(-4px) scale(1.05);animation:btnPulse 0.8s infinite;box-shadow:0 0 60px rgba(255,215,0,0.9);}

        /* 砸金蛋：亮眼质感+开始后显示 */
        .egg-container{display:none;gap:36px;flex-wrap:wrap;justify-content:center;animation:fadeUp 0.8s ease-out 0.35s both;}
        .golden-egg{
            width:140px;height:180px;
            background:radial-gradient(circle at 30% 22%,#FFFFFF 0%,#FFF9CC 20%,var(--gold-light) 45%,var(--gold-main) 70%,var(--gold-dark) 100%);
            border-radius:55% 55% 50% 50%;
            display:flex;align-items:center;justify-content:center;
            font-size:64px;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.19,1,0.22,1);
            border:4px solid rgba(255,255,255,0.4);
            box-shadow:var(--shadow-gold),inset 0 -18px 36px rgba(0,0,0,0.2);
            position:relative;
            overflow:hidden;
        }
        .golden-egg::before{
            content:"";
            position:absolute;
            top:0;left:-200%;
            width:100%;height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.6),transparent);
            transition:left 1s ease-out;
        }
        .golden-egg:hover::before{left:200%;}
        .golden-egg:hover{transform:translateY(-18px) scale(1.08);box-shadow:0 0 60px rgba(255,215,0,0.7);}
        .golden-egg.shaking{animation:eggShake 0.2s ease-in-out 6;}
        .golden-egg.opened{
            background:linear-gradient(180deg,#333355,#1A1A33);
            transform:scale(0.88);
            animation:none;
            cursor:default;
            box-shadow:inset 0 0 40px rgba(0,0,0,0.7);
        }
        .golden-egg.opened::after{content:"💥";font-size:80px;animation:bounceIn 0.6s ease-out;}

        /* 幸运转盘：高亮指针+点击开始+旋转按钮 */
        .wheel-container{display:none;position:relative;width:480px;height:480px;animation:fadeUp 0.8s ease-out 0.35s both;}
        .wheel-outer{
            width:100%;height:100%;
            border-radius:50%;
            border:14px solid var(--gold-main);
            background:var(--bg-card);
            box-shadow:var(--shadow-gold),inset 0 0 50px rgba(0,0,0,0.5);
            position:relative;
            overflow:hidden;
        }
        .wheel-inner{width:100%;height:100%;position:absolute;top:0;left:0;transition:none;}
        .wheel-segment{
            position:absolute;width:50%;height:50%;left:50%;top:0;
            transform-origin:bottom left;
            display:flex;align-items:center;justify-content:center;
            font-size:17px;font-weight:800;color:#000;
            border-right:1px solid rgba(0,0,0,0.18);
            text-shadow:0 0 6px rgba(255,255,255,0.6);
        }
        .wheel-segment span{transform:rotate(calc(180deg / var(--seg) * 0.5));padding-top:45px;}
        .wheel-pointer{
            position:absolute;top:-45px;left:50%;
            transform:translateX(-50%);
            width:0;height:0;
            border-left:40px solid transparent;border-right:40px solid transparent;border-top:80px solid var(--gold-main);
            z-index:10;
            filter:drop-shadow(0 0 20px rgba(255,215,0,0.9));
            cursor:pointer;
            transition:transform 0.2s ease;
            animation:glowBreath 1.5s infinite;
        }
        .wheel-pointer:hover{transform:translateX(-50%) scale(1.18);animation:btnPulse 0.6s infinite;}
        .wheel-inner.spinning{animation:wheelSpin 8s cubic-bezier(0.14,0.8,0.08,1) forwards;}

        /* 神秘盲盒：立体发光+开始后显示 */
        .box-container{display:none;gap:30px;flex-wrap:wrap;justify-content:center;animation:fadeUp 0.8s ease-out 0.35s both;}
        .mystery-box{
            width:150px;height:190px;
            border-radius:22px;
            background:linear-gradient(180deg,#FFFFFF 0%,#FFF9CC 15%,var(--gold-light) 40%,var(--gold-main) 65%,var(--gold-dark) 100%);
            display:flex;align-items:center;justify-content:center;
            font-size:64px;
            cursor:pointer;
            transition:all 0.3s cubic-bezier(0.19,1,0.22,1);
            border:4px solid rgba(255,255,255,0.4);
            box-shadow:var(--shadow-gold);
            position:relative;
            perspective:1200px;
        }
        .mystery-box::after{
            content:"";
            position:absolute;
            inset:0;
            border-radius:20px;
            background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,0.18) 100%);
            pointer-events:none;
        }
        .mystery-box:hover{transform:translateY(-20px) scale(1.08);box-shadow:0 0 60px rgba(255,215,0,0.7);}
        .mystery-box.opened{
            background:linear-gradient(180deg,#333355,#1A1A33);
            animation:boxFlip 1.1s ease-out forwards;
            cursor:default;
            box-shadow:inset 0 0 45px rgba(0,0,0,0.7);
        }
        .mystery-box.opened::before{
            content:"已开启";
            position:absolute;
            font-size:20px;
            color:var(--text-gray);
            font-weight:700;
        }

        /* 终极中奖仪式感：多层特效+完整信息 */
        .win-modal{
            position:fixed;inset:0;
            background:rgba(0,0,0,0.95);
            display:none;align-items:center;justify-content:center;
            z-index:9999;
            padding:24px;
            backdrop-filter:blur(20px);
        }
        .win-modal.show{display:flex;}
        .win-card{
            background:linear-gradient(160deg,var(--bg-card),var(--bg-main));
            border-radius:32px;
            padding:50px 36px;
            text-align:center;
            max-width:500px;width:100%;
            border:4px solid var(--gold-main);
            box-shadow:0 0 80px rgba(255,215,0,0.6);
            animation:bounceIn 0.7s ease-out;
            position:relative;
            overflow:hidden;
        }
        .confetti-piece{
            position:absolute;
            width:14px;height:14px;
            animation:confettiFall 4s ease-out forwards;
        }
        .star-deco{
            position:absolute;
            font-size:24px;
            color:var(--gold-main);
            animation:starShine 1.5s infinite;
        }
        .win-icon{font-size:100px;margin-bottom:24px;animation:glowBreath 1s infinite alternate;}
        .win-title{font-size:30px;color:var(--gold-main);font-weight:900;margin-bottom:20px;letter-spacing:5px;}
        .win-prize{font-size:36px;font-weight:900;color:var(--gold-light);margin-bottom:16px;letter-spacing:6px;}
        .win-desc{font-size:17px;color:var(--text-gray);margin-bottom:32px;line-height:1.9;}
        .btn-group{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
        .btn{
            padding:16px 36px;
            border-radius:14px;
            border:none;
            font-weight:800;
            font-size:17px;
            cursor:pointer;
            transition:all 0.25s ease;
        }
        .btn.primary{
            background:linear-gradient(90deg,var(--gold-dark),var(--gold-main));
            color:#000;
            box-shadow:0 8px 24px rgba(255,215,0,0.5);
        }
        .btn.primary:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(255,215,0,0.7);}
        .btn.secondary{
            background:rgba(255,255,255,0.1);
            color:var(--text-white);
            border:2px solid var(--border-gold);
        }
        .btn.secondary:hover{background:rgba(255,255,255,0.2);transform:translateY(-2px);}

        .error-tip{color:#FF6B6B;font-size:20px;text-align:center;animation:fadeUp 0.6s ease-out;}
        .game-wrap{display:none;width:100%;max-width:540px;}
    </style>
</head>
<body>
<div id="errBox" class="error-tip" style="display:none;"></div>
<div id="gameWrap" class="game-wrap">
    <div class="brand-top">
        <div class="vip-title">红红VIP专属抽奖</div>
        <div class="count-badge">剩余抽奖次数：<span id="countLeft">0</span> 次</div>
    </div>
    <div class="start-wrap" id="startBox">
        <button class="start-btn" id="startBtn">🎁 立即开始抽奖</button>
    </div>
    <div class="egg-container" id="eggList"></div>
    <div class="wheel-container" id="wheelWrap">
        <div class="wheel-outer"><div class="wheel-inner" id="wheel"></div></div>
        <div class="wheel-pointer"></div>
    </div>
    <div class="box-container" id="boxList"></div>
</div>

<div class="win-modal" id="winModal">
    <div class="win-card">
        <div class="win-icon">🎊</div>
        <div class="win-title">恭喜您中奖啦</div>
        <div class="win-prize" id="winName"></div>
        <div class="win-desc" id="winNote"></div>
        <div class="btn-group">
            <button class="btn secondary" id="copyVoucher">复制中奖凭证</button>
            <button class="btn primary" id="closeWin">太棒了！</button>
        </div>
    </div>
</div>

<script>
const SIGN = "HHGJ_2026_GAME_FINAL_PERFECT";
const STORAGE_KEY = "HHGJ_DATA_GAME";
let prizeConfig, winRecords, gameInfo, usedTotal = 0, started = false;

function showErr(msg){document.getElementById("errBox").style.display="block";document.getElementById("errBox").innerText=msg;}
function loadPrize(){
    const defaultPool = {
        egg: [{name:"8元彩金",stock:20,rate:52.6},{name:"18元彩金",stock:10,rate:26.3},{name:"28元彩金",stock:5,rate:13.2},{name:"38元彩金",stock:3,rate:7.9}],
        wheel: [{name:"谢谢参与",color:"#F8F8F8",rate:40},{name:"5元优惠券",color:"#E6F2FF",rate:30},{name:"15元优惠券",color:"#FFF8E0",rate:20},{name:"免单福利",color:"#FFD700",rate:8},{name:"终极大奖",color:"#FF4D4F",rate:2}],
        box: [{name:"再来一次",rare:"普通",rate:45},{name:"精美小礼品",rare:"普通",rate:35},{name:"20元通用券",rare:"稀有",rate:15},{name:"惊喜大礼包",rare:"史诗",rate:4},{name:"超级终极大奖",rare:"传说",rate:1}]
    };
    try{
        const local = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        prizeConfig = local.prizePool || defaultPool;
        winRecords = local.winList || [];
    }catch(e){prizeConfig = defaultPool; winRecords = [];}
}

function parseUrl(){
    const hash = window.location.hash.slice(1);
    if(!hash) return showErr("无效链接，请联系管理员获取红红VIP专属参与入口");
    const p = new URLSearchParams(hash);
    const sign = p.get("s"), uid = decodeURIComponent(p.get("id")), type = p.get("t"), total = Number(p.get("n")), expire = Number(p.get("e"));
    if(!sign||!uid||!type||!total||!expire) return showErr("链接参数异常，请重新向管理员获取");
    if(Date.now() > expire) return showErr("链接已过期，请联系管理员重新生成");
    try{
        const verify = atob(sign);
        if(!verify.includes(SIGN) || !verify.includes(uid)) throw new Error("签名不匹配");
        // 次数锁定：仅当前链接有效，刷新/重进不恢复，用完即止
        const sessionKey = `HHGJ_${uid}_${type}_${total}`;
        const used = Number(localStorage.getItem(sessionKey) || 0);
        if(used >= total) return showErr("您的本次抽奖次数已用完，请联系管理员获取新的参与资格");
        gameInfo = {uid,type,total,sessionKey};
        document.getElementById("countLeft").innerText = total - used;
        usedTotal = used;
        document.getElementById("gameWrap").style.display = "block";
        initGame();
    }catch(err){showErr("链接无效或已被篡改，请联系管理员");}
}

function initGame(){
    document.getElementById("startBtn").onclick = startGame;
}
function startGame(){
    if(started) return;
    started = true;
    document.getElementById("startBox").style.display = "none";
    if(gameInfo.type === "egg"){
        document.getElementById("eggList").style.display = "flex";
        for(let i=0;i<gameInfo.total;i++){
            const egg = document.createElement("div");
            egg.className = "golden-egg"; egg.innerText = "🥚";
            egg.onclick = () => openEgg(egg);
            document.getElementById("eggList").appendChild(egg);
        }
    }else if(gameInfo.type === "wheel"){
        document.getElementById("wheelWrap").style.display = "block";
        const wheel = document.getElementById("wheel"); wheel.innerHTML = "";
        const list = prizeConfig.wheel, segCount = list.length, segDeg = 360/segCount;
        list.forEach((item,idx)=>{
            const seg = document.createElement("div");
            seg.className = "wheel-segment";
            seg.style.background = item.color;
            seg.style.transform = `rotate(${idx*segDeg}deg)`;
            seg.style.setProperty("--seg",segCount);
            seg.innerHTML = `<span>${item.name}</span>`;
            wheel.appendChild(seg);
        });
        document.querySelector(".wheel-pointer").onclick = spinWheel;
    }else{
        document.getElementById("boxList").style.display = "flex";
        for(let i=0;i<gameInfo.total;i++){
            const box = document.createElement("div");
            box.className = "mystery-box"; box.innerText = "🎁";
            box.onclick = () => openBox(box);
            document.getElementById("boxList").appendChild(box);
        }
    }
}

function getRandomPrize(type){
    let rand = Math.random()*100, sum = 0;
    for(let item of prizeConfig[type]){sum += item.rate; if(rand <= sum) return item;}
    return prizeConfig[type][0];
}

function showFullCelebration(){
    const colors = ["#FFD700","#FF6B6B","#4ECDC4","#45B7D1","#FF9F43","#A55EEA","#2ED573","#FF3366"];
    const card = document.querySelector(".win-card");
    for(let i=0;i<60;i++){
        const c = document.createElement("div");
        c.className = "confetti-piece";
        c.style.left = `${Math.random()*100}%`;
        c.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDelay = `${Math.random()*0.8}s`;
        card.appendChild(c);
        setTimeout(()=>c.remove(),4000);
    }
    for(let i=0;i<8;i++){
        const s = document.createElement("div");
        s.className = "star-deco";
        s.innerText = "★";
        s.style.left = `${Math.random()*100}%`;
        s.style.top = `${Math.random()*100}%`;
        s.style.animationDelay = `${Math.random()*1.2}s`;
        card.appendChild(s);
        setTimeout(()=>s.remove(),3000);
    }
}

function showWinResult(prize,extra){
    const voucher = btoa(`${SIGN}|${gameInfo.uid}|${prize.name}|${Date.now()}|${Math.random().toString(36).slice(2,18)}`).replace(/=/g,"");
    winRecords.push({voucher,uid:gameInfo.uid,prize:prize.name,extra:extra||"",time:new Date().toLocaleString()});
    localStorage.setItem(STORAGE_KEY, JSON.stringify({prizePool:prizeConfig,winList:winRecords}));
    document.getElementById("winName").innerText = prize.name;
    document.getElementById("winNote").innerText = extra||"";
    document.getElementById("winModal").classList.add("show");
    showFullCelebration();
    window.LAST_VOUCHER = voucher;
}

document.getElementById("copyVoucher").onclick = () => {
    navigator.clipboard.writeText(window.LAST_VOUCHER||"");
    alert("✅ 中奖凭证已复制，红红VIP专属权益已为您记录！");
};
document.getElementById("closeWin").onclick = () => {
    document.getElementById("winModal").classList.remove("show");
};

function openEgg(el){
    if(el.classList.contains("opened") || usedTotal >= gameInfo.total) return;
    el.classList.add("shaking");
    setTimeout(()=>{
        el.classList.remove("shaking"); el.classList.add("opened");
        usedTotal++;
        localStorage.setItem(gameInfo.sessionKey, usedTotal);
        showWinResult(getRandomPrize("egg"),`第${usedTotal}/${gameInfo.total}次抽奖 · 红红VIP专属福利`);
        document.getElementById("countLeft").innerText = gameInfo.total - usedTotal;
    },1100);
}

function spinWheel(){
    const wheel = document.getElementById("wheel");
    if(wheel.classList.contains("spinning") || usedTotal >= gameInfo.total) return;
    usedTotal++;
    localStorage.setItem(gameInfo.sessionKey, usedTotal);
    const prize = getRandomPrize("wheel");
    const list = prizeConfig.wheel, idx = list.indexOf(prize), segDeg = 360/list.length;
    const stopAngle = 360 - (idx*segDeg + segDeg/2);
    wheel.style.setProperty("--stop-deg",stopAngle+"deg");
    wheel.classList.add("spinning");
    setTimeout(()=>{
        wheel.classList.remove("spinning");
        showWinResult(prize,`第${usedTotal}/${gameInfo.total}次抽奖 · 红红VIP专属福利`);
        document.getElementById("countLeft").innerText = gameInfo.total - usedTotal;
    },8000);
}

function openBox(el){
    if(el.classList.contains("opened") || usedTotal >= gameInfo.total) return;
    el.classList.add("opened");
    usedTotal++;
    localStorage.setItem(gameInfo.sessionKey, usedTotal);
    const prize = getRandomPrize("box");
    showWinResult(prize,`第${usedTotal}/${gameInfo.total}次抽奖 · ${prize.rare}品质 · 红红VIP专属福利`);
    document.getElementById("countLeft").innerText = gameInfo.total - usedTotal;
}

window.onload = () => {loadPrize(); parseUrl();};
</script>
</body>
</html>
